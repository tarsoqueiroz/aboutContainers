apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
  namespace: network
spec:
  replicas: 2
  selector:
    matchLabels: { app: demo-api }
  template:
    metadata:
      labels: { app: demo-api }
    spec:
      containers:
        - name: demo-api
          image: kennethreitz/httpbin
          resources:
            limits:
              memory: "128Mi"
              cpu: "250m"
            requests:
              memory: "64Mi"
              cpu: "125m"
          ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata:
  name: demo-api
  namespace: network
spec:
  selector: { app: demo-api }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: demo-api
  namespace: network
spec:
  parentRefs:
    - name: cilium-gateway
  hostnames:
    - "api.0a0f122c.nip.io"
  rules:
    - backendRefs:
        - name: demo-api
          port: 80
